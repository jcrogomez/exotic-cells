<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Exotic Cells: the three regions of the SKY130 configuration space, and the XC-20 separation matrix</title>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- Left panel: three regions -->
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#1f2328">What the design rules allow</text>
  <rect x="20" y="48" width="420" height="300" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="34" y="72" fill="#57606a">legal layouts</text>
  <rect x="44" y="90" width="170" height="96" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="58" y="118" font-weight="bold" fill="#0969da">1. Standard cells</text>
  <text x="58" y="140" fill="#1f2328">what is already used</text>
  <rect x="260" y="262" width="164" height="76" rx="8" fill="#ffebe9" stroke="#cf222e"/>
  <text x="274" y="286" font-weight="bold" fill="#cf222e">2. What fails</text>
  <text x="274" y="306" fill="#1f2328">shorts, nothing,</text>
  <text x="274" y="326" fill="#1f2328">the reader itself</text>
  <rect x="160" y="166" width="190" height="84" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="174" y="192" font-weight="bold" fill="#1a7f37">3. The hunt</text>
  <text x="174" y="214" fill="#1f2328">ignored behaviour,</text>
  <text x="174" y="234" fill="#1f2328">drawn on purpose</text>
  <text x="20" y="378" fill="#57606a">Each family looks for its two borders:</text>
  <text x="20" y="398" fill="#57606a">with the conventional, and with failure.</text>

  <!-- Right panel: XC-20 matrix -->
  <text x="490" y="32" font-size="17" font-weight="bold" fill="#1f2328">XC-20: what each structure is for</text>
  <g font-size="13">
    <!-- row 0 -->
    <rect x="490" y="58" width="56" height="34" fill="#ffd8b5" stroke="#9a6700"/><text x="506" y="80">p+</text>
    <rect x="546" y="58" width="56" height="34" fill="#b6e3ff" stroke="#0969da"/><text x="562" y="80">n+</text>
    <text x="700" y="72" font-weight="bold">gap 0</text><text x="700" y="88" fill="#57606a">the bet: tunnelling</text>
    <!-- row 0.27 -->
    <rect x="490" y="112" width="56" height="34" fill="#ffd8b5" stroke="#9a6700"/><text x="506" y="134">p+</text>
    <rect x="566" y="112" width="56" height="34" fill="#b6e3ff" stroke="#0969da"/><text x="582" y="134">n+</text>
    <text x="700" y="126" font-weight="bold">0.27 µm</text><text x="700" y="142" fill="#57606a">first legal gap: residual signal</text>
    <!-- row 0.54 -->
    <rect x="490" y="166" width="56" height="34" fill="#ffd8b5" stroke="#9a6700"/><text x="506" y="188">p+</text>
    <rect x="586" y="166" width="56" height="34" fill="#b6e3ff" stroke="#0969da"/><text x="602" y="188">n+</text>
    <text x="700" y="180" font-weight="bold">0.54 µm</text><text x="700" y="196" fill="#57606a">ordinary leakage + background</text>
    <!-- row 1.08 -->
    <rect x="490" y="220" width="56" height="34" fill="#ffd8b5" stroke="#9a6700"/><text x="506" y="242">p+</text>
    <rect x="626" y="220" width="56" height="34" fill="#b6e3ff" stroke="#0969da"/><text x="642" y="242">n+</text>
    <text x="700" y="234" font-weight="bold">1.08 µm</text><text x="700" y="250" fill="#57606a">far reference: does leakage keep falling?</text>
    <!-- no junction -->
    <rect x="490" y="274" width="192" height="34" fill="#eaeef2" stroke="#8c959f" stroke-dasharray="4 3"/>
    <text x="520" y="296">n-well only</text>
    <text x="700" y="288" font-weight="bold">no junction</text><text x="700" y="304" fill="#57606a">what the reader sees with nothing there</text>
  </g>
  <text x="490" y="346" fill="#1f2328">Only the first row is meant to contain the unusual physics.</text>
  <text x="490" y="366" fill="#1f2328">The others hold the ordinary physics, so the first can be identified.</text>
  <text x="490" y="398" font-size="12" fill="#57606a">Conceptual, not to scale; not a prediction of the currents.</text>
</svg>
