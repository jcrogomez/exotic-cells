<!--

  Galois (MISFIT-04): the tile as built and what has been checked on it, step by step.
  One self-contained file: no external requests. Built from instrument/galois/viewer/ by build.py; the data comes from extract.py.
  The form (one screen, steps along the top, the layout at true scale with whatever is not the step's subject greyed out) is
  modelled on the Tiny Breakout physical design tutorial by Alexei Zverovitch (github.com/zvea/tiny-breakout). No code is shared.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galois: the MISFIT-04 tile, step by step</title>
<script>

  var t = null;
  try { t = localStorage.getItem("galois-theme"); } catch (e) {}

  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
:root {
  --bg: #ffffff; --ink: #1b1d1f; --muted: #5d6369; --rule: #c9cdd1; --bar: #eef0f2; --focus: #1a56c4;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage: #f3f4f6; --die: #d9dde2; --die-edge: #7d8792; --core: #fbfbfc; --grey: #aab2bb;
  --logic: #d9b662; --ff: #2f9a8b; --buf: #d64f98; --fill: #b9c1ca; --tap: #8a95a1; --diode: #b8860b; --tie: #8d8a33;
  --nwell: #8bc34a; --diff: #a39a35; --poly: #9c1b34; --li1: #8d82c9; --met1: #2b9fd8; --met2: #e0458f; --met3: #34a853; --met4: #e8a317;
  --cut: #1f2630; --vpwr: #d0453a; --vgnd: #2f63c4; --add: #e4572e; --del: #7b2fd6; --label: #1b1d1f; --halo: rgba(255,255,255,0.85);
  --ok: #1e7d4f; --bad: #b3261e; --unk: #8a6100;
}
:root[data-theme="dark"] {
  --bg: #121416; --ink: #e4e6e8; --muted: #9aa0a6; --rule: #3d4247; --bar: #1d2125; --focus: #7fb0ff;
  --stage: #0d0f11; --die: #2a2f35; --die-edge: #8a949f; --core: #1b1f23; --grey: #4a525b;
  --logic: #cfae5f; --ff: #36b3a2; --buf: #ec62ab; --fill: #3b424a; --tap: #58626d; --diode: #d6a21f; --tie: #a8a544;
  --nwell: #6f9c3c; --diff: #c2b84a; --poly: #e0556f; --li1: #a79cf0; --met1: #3fb2ea; --met2: #f060a4; --met3: #46c46a; --met4: #f2b233;
  --cut: #e4e6e8; --vpwr: #ff6b5e; --vgnd: #5b8dee; --add: #ff7a4d; --del: #b47bff; --label: #e4e6e8; --halo: rgba(13,15,17,0.85);
  --ok: #4ec58a; --bad: #ff7b72; --unk: #e0b341;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(300px, 30%) 1fr; grid-template-rows: auto 1fr; height: 100%; }
.top { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--bar); }
.brand h1 { font-size: 16px; margin: 0; color: var(--focus); white-space: nowrap; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
.steps { flex: 1; min-width: 0; overflow-x: auto; }
.track { display: flex; min-width: max-content; }
.track button { flex: 1; min-width: 62px; background: none; border: 0; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
.track button::before { content: ""; position: absolute; top: 12px; left: 0; right: 0; height: 1px; background: var(--rule); z-index: 0; }
.track button i { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); background: var(--bg); display: grid; place-items: center; font-style: normal; font-size: 11px; }
.track button.on { color: var(--ink); font-weight: 600; }
.track button.on i { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.track button.seen i { border-color: var(--ink); }
.track button:focus-visible, .iconbtn:focus-visible, .nav button:focus-visible, .pick button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.iconbtn { width: 30px; height: 30px; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 16px; height: 16px; }
.panel { overflow-y: auto; padding: 12px 16px 28px; border-right: 1px solid var(--rule); }
.nav { display: flex; gap: 8px; margin-bottom: 12px; }
.nav button { flex: 1; padding: 6px; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; cursor: pointer; }
.nav button[disabled] { opacity: 0.4; cursor: default; }
.panel h2 { font-size: 17px; margin: 0 0 4px; }
.lede { color: var(--muted); font-size: 13px; margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.panel p { margin: 0 0 10px; }
.panel code { font-family: var(--mono); font-size: 13px; }
.panel table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 0 0 12px; }
.panel th, .panel td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.panel th { color: var(--muted); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.grade { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.g-ok { color: var(--ok); } .g-bad { color: var(--bad); } .g-unk { color: var(--unk); }
.src { font-size: 12px; color: var(--muted); }
.model { font-size: 12px; color: var(--unk); border: 1px solid var(--unk); border-radius: 6px; padding: 6px 8px; margin: 0 0 10px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.pick button { padding: 4px 9px; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 13px; }
.pick button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stage { position: relative; background: var(--stage); min-width: 0; min-height: 0; }
.view { position: absolute; inset: 0; outline: none; touch-action: none; cursor: grab; }
.view.drag { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
.zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.legend { position: absolute; left: 50px; top: 10px; right: 10px; margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; pointer-events: none; }
.legend li { display: flex; align-items: center; gap: 5px; background: var(--halo); padding: 1px 5px; border-radius: 4px; }
.legend i { width: 12px; height: 12px; border: 1px solid rgba(127,127,127,0.6); display: inline-block; }
.scale { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--muted); }
.scale i { display: block; height: 5px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 3px 7px; border-radius: 4px; white-space: nowrap; transform: translate(12px, 12px); }
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 760px); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
.card h3 { margin: 0 0 6px; font-size: 14px; }
.card svg { width: 100%; height: auto; display: block; }
.card .src { margin-top: 6px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  .top { flex-wrap: wrap; position: sticky; top: 0; z-index: 3; }
  .stage { height: 62vh; }
  .panel { border-right: 0; border-bottom: 1px solid var(--rule); }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Galois · MISFIT-04</h1><p>The tile as built, and what was checked on it</p></div>
    <nav class="steps" aria-label="Steps"><div class="track" id="track"></div></nav>
    <button type="button" class="iconbtn" id="theme" aria-label="Switch theme"></button>
  </header>
  <main class="panel" id="panel">
    <div class="nav">
      <button type="button" id="prev">&larr; Back</button>
      <button type="button" id="next">Next &rarr;</button>
    </div>
    <h2 id="title" tabindex="-1"></h2>
    <div id="body"></div>
  </main>
  <section class="stage" aria-label="The tile at this step">
    <div class="view" id="view" tabindex="0" role="group" aria-label="The tile: scroll or + and - to zoom, drag to move, arrow keys to step">
      <canvas id="canvas" role="img" aria-label="The tile layout"></canvas>
      <div class="loading" id="loading">Loading the layout…</div>
      <div class="zoom">
        <button type="button" class="iconbtn" id="zin" aria-label="Zoom in (+)" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
        <button type="button" class="iconbtn" id="zout" aria-label="Zoom out (-)" title="Zoom out (-)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
        <button type="button" class="iconbtn" id="zfit" aria-label="Back to this step's view (0)" title="Back to this step's view (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      </div>
      <ul class="legend" id="legend" aria-label="Legend"></ul>
      <div class="scale"><i id="scalebar"></i><span id="scaletext"></span></div>
      <div class="card" id="card" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var bin = atob(DATA_GZ), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  var loading = document.getElementById("loading");
  if (typeof DecompressionStream === "undefined") { loading.textContent = "This page needs a browser from 2023 or later (DecompressionStream)."; return; }
  new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    .then(function (text) { start(JSON.parse(text)); loading.remove(); })
    .catch(function (e) { loading.textContent = "Could not show the layout: " + e; console.error(e); });
})();

function start(D) {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = 1000;                                   // database units per µm
  function um(v) { return v / U; }
  function fmt(v, dp) { return v.toLocaleString("en-GB", { minimumFractionDigits: dp === undefined ? 2 : dp, maximumFractionDigits: dp === undefined ? 2 : dp }); }
  function n(v) { return v.toLocaleString("en-GB"); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function grade(k, txt) { return '<span class="grade g-' + k + '">' + txt + "</span>"; }

  // ---- colours, read from the stylesheet so both themes work -------------------------------------
  var C = {};
  function readColours() {
    var cs = getComputedStyle(document.documentElement);
    ["stage", "die", "die-edge", "core", "grey", "logic", "ff", "buf", "fill", "tap", "diode", "tie", "nwell", "diff", "poly", "li1", "met1", "met2", "met3", "met4",
     "cut", "vpwr", "vgnd", "add", "del", "label", "halo", "ink", "muted", "rule", "bg", "ok", "bad", "unk", "focus"].forEach(function (k) { C[k] = cs.getPropertyValue("--" + k).trim(); });
  }
  readColours();

  // ---- geometry: one Path2D per drawable, in database units -------------------------------------
  // A drawable's key is <part>.<layer>: cells.* (the core's standard cells by class), corew.* (the core's wiring),
  // mac.* (the XC-19 macro), wrap.* (its wrapper: risers and stubs), top.* (what the tile's assembly adds)
  var G = {}, ORDER = [];
  function addShapes(part, sh, layers) {
    layers.forEach(function (l) {
      var p = new Path2D(), r = sh[l] || [], q = sh["~" + l] || [], k;
      for (k = 0; k < r.length; k += 4) p.rect(r[k], r[k + 1], r[k + 2] - r[k], r[k + 3] - r[k + 1]);
      q.forEach(function (pts) { p.moveTo(pts[0], pts[1]); for (var j = 2; j < pts.length; j += 2) p.lineTo(pts[j], pts[j + 1]); p.closePath(); });
      if (!r.length && !q.length) return;
      var col = /con$|^via/.test(l) ? "cut" : l;
      G[part + "." + l] = { path: p, col: col, a: 0, to: 0, from: 0 }; ORDER.push(part + "." + l);
    });
  }
  var CLS = ["fill", "tap", "logic", "buf", "ff", "diode", "tie"];
  CLS.forEach(function (c) {
    var p = new Path2D(), any = false;
    D.cells.forEach(function (q) { if (D.mcls[q[4]] === c) { p.rect(q[0], q[1], q[2], q[3]); any = true; } });
    if (any) { G["cells." + c] = { path: p, col: c, a: 0, to: 0, from: 0, edge: true }; ORDER.push("cells." + c); }
  });
  addShapes("corew", D.corew, ["met1", "met2", "met3", "met4"]);
  addShapes("mac", D.mac, ["nwell", "diff", "poly", "licon", "li1", "mcon", "met1", "via1", "met2"]);
  addShapes("wrap", D.wrap, ["li1", "mcon", "met1", "via1", "met2", "via2", "met3", "via3", "met4"]);
  addShapes("top", D.top, ["met3", "via3", "met4"]);
  var NCLS = {};
  D.cells.forEach(function (q) { var c = D.mcls[q[4]]; NCLS[c] = (NCLS[c] || 0) + 1; });
  var CELL = {};

  var LEG = { logic: "Logic", ff: "Flip-flop", buf: "Buffer", fill: "Fill, decap", tap: "Tap", nwell: "n-well", diff: "Diffusion", poly: "Poly", li1: "li1", met1: "met1", met2: "met2", met3: "met3", met4: "met4", add: "Added by the sabotage", del: "Removed by it" };
  var track = $("track"), seen = {};
  STEPS.forEach(function (s, i) {
    var b = document.createElement("button"); b.type = "button"; b.innerHTML = "<i>" + (i + 1) + "</i>" + s.short;
    b.addEventListener("click", function () { go(i); }); track.appendChild(b);
  });
  function renderPanel() {
    var st = STEPS[cur];
    $("title").textContent = st.title;
    $("body").innerHTML = '<p class="lede">' + st.lede + "</p>" + st.body();
    var pick = $("sabpick");
    if (pick) pick.addEventListener("click", function (e) {
      var s = e.target.getAttribute && e.target.getAttribute("data-s"); if (!s) return;
      sabSel = s; var top = $("panel").scrollTop; renderPanel(); $("panel").scrollTop = top;
      moveCam(STEPS[cur].view()); t0 = performance.now(); requestAnimationFrame(frame);
    });
    if (st.card) { card.innerHTML = st.card(); card.hidden = false; } else card.hidden = true;
    $("legend").innerHTML = (st.legend || []).map(function (k) { return '<li><i style="background:' + C[k] + '"></i>' + LEG[k] + "</li>"; }).join("");
  }
  function go(i, instant) {
    if (i < 0 || i >= STEPS.length) return;
    cur = i; seen[i] = 1;
    var st = STEPS[cur];
    ORDER.forEach(function (k) { var g = G[k]; g.from = g.a; g.to = st.show[k] || 0; if (instant) g.a = g.to; });
    moveCam(st.view(), instant); t0 = performance.now();
    Array.prototype.forEach.call(track.children, function (b, j) { b.className = (j === cur ? "on " : "") + (seen[j] ? "seen" : ""); if (j === cur) { b.setAttribute("aria-current", "step"); if (b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "nearest" }); } else b.removeAttribute("aria-current"); });
    $("prev").disabled = cur === 0; $("next").disabled = cur === STEPS.length - 1;
    renderPanel(); $("panel").scrollTop = 0;
    try { history.replaceState(null, "", "#" + st.id); } catch (e) {}
    requestAnimationFrame(frame);
  }
  $("prev").addEventListener("click", function () { go(cur - 1); });
  $("next").addEventListener("click", function () { go(cur + 1); });

  // ---- zoom, pan, hover, keys ----------------------------------------------------------------------
  function zoomAt(px, py, f) { var x = wx(px), y = wy(py); cam.s *= f; cam.x = x - (px - W / 2) / cam.s; cam.y = y + (py - H / 2) / cam.s; camTo = null; userMoved = true; draw(); }
  view.addEventListener("wheel", function (e) { e.preventDefault(); var r = view.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  var ptrs = {}, pinch = 0;
  view.addEventListener("pointerdown", function (e) { if (e.target.closest && e.target.closest("button, .card")) return; ptrs[e.pointerId] = [e.clientX, e.clientY]; view.setPointerCapture(e.pointerId); view.classList.add("drag"); pinch = 0; });
  view.addEventListener("pointermove", function (e) {
    var r = view.getBoundingClientRect(), p = ptrs[e.pointerId], ids = Object.keys(ptrs);
    if (p && ids.length === 1) { cam.x -= (e.clientX - p[0]) / cam.s; cam.y += (e.clientY - p[1]) / cam.s; ptrs[e.pointerId] = [e.clientX, e.clientY]; camTo = null; userMoved = true; tip.hidden = true; draw(); return; }
    if (p && ids.length === 2) {
      ptrs[e.pointerId] = [e.clientX, e.clientY];
      var a = ptrs[ids[0]], b = ptrs[ids[1]], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch) zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, d / pinch);
      pinch = d; return;
    }
    hover(e.clientX - r.left, e.clientY - r.top);
  });
  function up(e) { delete ptrs[e.pointerId]; pinch = 0; if (!Object.keys(ptrs).length) view.classList.remove("drag"); }
  view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
  view.addEventListener("pointerleave", function () { tip.hidden = true; });
  function hover(px, py) {
    var x = wx(px), y = wy(py), txt = null, st = STEPS[cur];
    if (st.card) { tip.hidden = true; return; }
    if ((G["cells.logic"].to > 0.5 || st.id === "aggressors") && x >= CORE[0] && x <= CORE[2] && y >= CORE[1] && y <= CORE[3]) {
      for (var i = 0; i < D.cells.length; i++) { var q = D.cells[i]; if (x >= q[0] && x < q[0] + q[2] && y >= q[1] && y < q[1] + q[3]) { txt = q[5] + " · " + D.masters[q[4]]; break; } }
    } else if (G["mac.li1"].to > 0.5) {
      var best = null, bd = 30 / cam.s;
      D.nodes.forEach(function (q) { var d = Math.hypot(q[1] - x, q[2] - y); if (d < bd) { bd = d; best = q; } });
      if (best) txt = "node " + best[0];
    }
    if (txt) { tip.textContent = txt; tip.style.left = px + "px"; tip.style.top = py + "px"; tip.hidden = false; } else tip.hidden = true;
  }
  $("zin").addEventListener("click", function () { zoomAt(W / 2, H / 2, 1.5); });
  $("zout").addEventListener("click", function () { zoomAt(W / 2, H / 2, 1 / 1.5); });
  $("zfit").addEventListener("click", function () { moveCam(STEPS[cur].view()); t0 = performance.now(); requestAnimationFrame(frame); });
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown") { go(cur + 1); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "PageUp") { go(cur - 1); e.preventDefault(); }
    else if (k === "+" || k === "=") zoomAt(W / 2, H / 2, 1.5);
    else if (k === "-") zoomAt(W / 2, H / 2, 1 / 1.5);
    else if (k === "0") $("zfit").click();
  });

  // ---- theme ---------------------------------------------------------------------------------------
  var themeBtn = $("theme");
  var ICON = { light: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M3.2 12.8l1.1-1.1M11.7 4.3l1.1-1.1"/></svg>',
               dark: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M13.6 9.6A5.6 5.6 0 0 1 6.4 2.4a5.6 5.6 0 1 0 7.2 7.2z"/></svg>' };
  function themeUI() { var th = document.documentElement.getAttribute("data-theme"), nx = th === "dark" ? "light" : "dark"; themeBtn.innerHTML = ICON[nx]; themeBtn.setAttribute("aria-label", "Switch to " + nx + " theme"); themeBtn.title = "Switch to " + nx + " theme"; }
  themeBtn.addEventListener("click", function () {
    var nx = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx); try { localStorage.setItem("galois-theme", nx); } catch (e) {}
    readColours(); themeUI(); renderPanel(); draw();
  });
  themeUI();

  window.addEventListener("hashchange", function () { STEPS.forEach(function (st, i) { if ("#" + st.id === location.hash && i !== cur) go(i); }); });
  window.addEventListener("resize", resize);
  var r0 = view.getBoundingClientRect(); W = r0.width; H = r0.height;
  var first = 0; STEPS.forEach(function (s, i) { if ("#" + s.id === location.hash) first = i; });
  go(first, true); resize();
  window.galoisProbe = { steps: STEPS.map(function (s) { return s.id; }), go: go, state: function () { return { cur: cur, cam: cam, W: W, H: H }; } };
}
</script>
