  Galois (MISFIT-04): the tile as built and what has been checked on it, step by step.
  One self-contained file: no external requests. Built from instrument/galois/viewer/ by build.py; the data comes from extract.py.
  The form (one screen, steps along the top, the layout at true scale with whatever is not the step's subject greyed out) is
  modelled on the Tiny Breakout physical design tutorial by Alexei Zverovitch (github.com/zvea/tiny-breakout). No code is shared.

<html lang="en">
<head>
<meta charset="utf-8">

<title>Galois: the MISFIT-04 tile, step by step</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("galois-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
:root {
  --bg: #ffffff; --ink: #1b1d1f; --muted: #5d6369; --rule: #c9cdd1; --bar: #eef0f2; --focus: #1a56c4;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --stage: #f3f4f6; --die: #d9dde2; --die-edge: #7d8792; --core: #fbfbfc; --grey: #aab2bb;
  --logic: #d9b662; --ff: #2f9a8b; --buf: #d64f98; --fill: #b9c1ca; --tap: #8a95a1; --diode: #b8860b; --tie: #8d8a33;
  --nwell: #8bc34a; --diff: #a39a35; --poly: #9c1b34; --li1: #8d82c9; --met1: #2b9fd8; --met2: #e0458f; --met3: #34a853; --met4: #e8a317;
  --cut: #1f2630; --vpwr: #d0453a; --vgnd: #2f63c4; --add: #e4572e; --del: #7b2fd6; --label: #1b1d1f; --halo: rgba(255,255,255,0.85);
  --ok: #1e7d4f; --bad: #b3261e; --unk: #8a6100;
}
:root[data-theme="dark"] {
  --bg: #121416; --ink: #e4e6e8; --muted: #9aa0a6; --rule: #3d4247; --bar: #1d2125; --focus: #7fb0ff;
  --stage: #0d0f11; --die: #2a2f35; --die-edge: #8a949f; --core: #1b1f23; --grey: #4a525b;
  --logic: #cfae5f; --ff: #36b3a2; --buf: #ec62ab; --fill: #3b424a; --tap: #58626d; --diode: #d6a21f; --tie: #a8a544;
  --nwell: #6f9c3c; --diff: #c2b84a; --poly: #e0556f; --li1: #a79cf0; --met1: #3fb2ea; --met2: #f060a4; --met3: #46c46a; --met4: #f2b233;
  --cut: #e4e6e8; --vpwr: #ff6b5e; --vgnd: #5b8dee; --add: #ff7a4d; --del: #b47bff; --label: #e4e6e8; --halo: rgba(13,15,17,0.85);
  --ok: #4ec58a; --bad: #ff7b72; --unk: #e0b341;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(300px, 30%) 1fr; grid-template-rows: auto 1fr; height: 100%; }
.top { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1px solid var(--rule); background: var(--bar); }
.brand h1 { font-size: 16px; margin: 0; color: var(--focus); white-space: nowrap; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
.steps { flex: 1; min-width: 0; overflow-x: auto; }
.track { display: flex; min-width: max-content; }
.track button { flex: 1; min-width: 62px; background: none; border: 0; padding: 2px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); position: relative; }
.track button::before { content: ""; position: absolute; top: 12px; left: 0; right: 0; height: 1px; background: var(--rule); z-index: 0; }
.track button i { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule); background: var(--bg); display: grid; place-items: center; font-style: normal; font-size: 11px; }
.track button.on { color: var(--ink); font-weight: 600; }
.track button.on i { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.track button.seen i { border-color: var(--ink); }
.track button:focus-visible, .iconbtn:focus-visible, .nav button:focus-visible, .pick button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.iconbtn { width: 30px; height: 30px; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.iconbtn svg { width: 16px; height: 16px; }
.panel { overflow-y: auto; padding: 12px 16px 28px; border-right: 1px solid var(--rule); }
.nav { display: flex; gap: 8px; margin-bottom: 12px; }
.nav button { flex: 1; padding: 6px; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; cursor: pointer; }
.nav button[disabled] { opacity: 0.4; cursor: default; }
.panel h2 { font-size: 17px; margin: 0 0 4px; }
.lede { color: var(--muted); font-size: 13px; margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.panel p { margin: 0 0 10px; }
.panel code { font-family: var(--mono); font-size: 13px; }
.panel table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 0 0 12px; }
.panel th, .panel td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.panel th { color: var(--muted); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.grade { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.g-ok { color: var(--ok); } .g-bad { color: var(--bad); } .g-unk { color: var(--unk); }
.src { font-size: 12px; color: var(--muted); }
.model { font-size: 12px; color: var(--unk); border: 1px solid var(--unk); border-radius: 6px; padding: 6px 8px; margin: 0 0 10px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.pick button { padding: 4px 9px; border: 1px solid var(--rule); background: var(--bg); border-radius: 6px; cursor: pointer; font-size: 13px; }
.pick button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stage { position: relative; background: var(--stage); min-width: 0; min-height: 0; }
.view { position: absolute; inset: 0; outline: none; touch-action: none; cursor: grab; }
.view.drag { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
.zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.legend { position: absolute; left: 50px; top: 10px; right: 10px; margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; pointer-events: none; }
.legend li { display: flex; align-items: center; gap: 5px; background: var(--halo); padding: 1px 5px; border-radius: 4px; }
.legend i { width: 12px; height: 12px; border: 1px solid rgba(127,127,127,0.6); display: inline-block; }
.scale { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--muted); }
.scale i { display: block; height: 5px; border: 1px solid var(--muted); border-top: 0; margin-bottom: 2px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 3px 7px; border-radius: 4px; white-space: nowrap; transform: translate(12px, 12px); }
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92%, 760px); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
.card h3 { margin: 0 0 6px; font-size: 14px; }
.card svg { width: 100%; height: auto; display: block; }
.card .src { margin-top: 6px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  .top { flex-wrap: wrap; position: sticky; top: 0; z-index: 3; }
  .stage { height: 62vh; }
  .panel { border-right: 0; border-bottom: 1px solid var(--rule); }
}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Galois · MISFIT-04</h1><p>The tile as built, and what was checked on it</p></div>
    <nav class="steps" aria-label="Steps"><div class="track" id="track"></div></nav>
    <button type="button" class="iconbtn" id="theme" aria-label="Switch theme"></button>
  </header>
  <main class="panel" id="panel">
    <div class="nav">
      <button type="button" id="prev">&larr; Back</button>

    <div id="body"></div>
  </main>
  <section class="stage" aria-label="The tile at this step">
    <div class="view" id="view" tabindex="0" role="group" aria-label="The tile: scroll or + and - to zoom, drag to move, arrow keys to step">
      <canvas id="canvas" role="img" aria-label="The tile layout"></canvas>
      <div class="loading" id="loading">Loading the layout…</div>
      <div class="zoom">
        <button type="button" class="iconbtn" id="zin" aria-label="Zoom in (+)" title="Zoom in (+)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
        <button type="button" class="iconbtn" id="zout" aria-label="Zoom out (-)" title="Zoom out (-)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
        <button type="button" class="iconbtn" id="zfit" aria-label="Back to this step's view (0)" title="Back to this step's view (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
      </div>
      <ul class="legend" id="legend" aria-label="Legend"></ul>
      <div class="scale"><i id="scalebar"></i><span id="scaletext"></span></div>
      <div class="card" id="card" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>
</div>

var DATA_GZ = "/*DATA*/";
</script>
<script>
(function () {
  "use strict";
  var bin = atob(DATA_GZ), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  var loading = document.getElementById("loading");
  if (typeof DecompressionStream === "undefined") { loading.textContent = "This page needs a browser from 2023 or later (DecompressionStream)."; return; }
  new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    .then(function (text) { start(JSON.parse(text)); loading.remove(); })
    .catch(function (e) { loading.textContent = "Could not show the layout: " + e; console.error(e); });
})();

function start(D) {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var U = 1000;                                   // database units per µm
  function um(v) { return v / U; }
  function fmt(v, dp) { return v.toLocaleString("en-GB", { minimumFractionDigits: dp === undefined ? 2 : dp, maximumFractionDigits: dp === undefined ? 2 : dp }); }
  function n(v) { return v.toLocaleString("en-GB"); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function grade(k, txt) { return '<span class="grade g-' + k + '">' + txt + "</span>"; }

  // ---- colours, read from the stylesheet so both themes work -------------------------------------
  var C = {};
  function readColours() {
    var cs = getComputedStyle(document.documentElement);
    ["stage", "die", "die-edge", "core", "grey", "logic", "ff", "buf", "fill", "tap", "diode", "tie", "nwell", "diff", "poly", "li1", "met1", "met2", "met3", "met4",
     "cut", "vpwr", "vgnd", "add", "del", "label", "halo", "ink", "muted", "rule", "bg", "ok", "bad", "unk", "focus"].forEach(function (k) { C[k] = cs.getPropertyValue("--" + k).trim(); });
  }
  readColours();

  // ---- geometry: one Path2D per drawable, in database units -------------------------------------
  // A drawable's key is <part>.<layer>: cells.* (the core's standard cells by class), corew.* (the core's wiring),
  // mac.* (the XC-19 macro), wrap.* (its wrapper: risers and stubs), top.* (what the tile's assembly adds)
  var G = {}, ORDER = [];
  function addShapes(part, sh, layers) {
    layers.forEach(function (l) {
      var p = new Path2D(), r = sh[l] || [], q = sh["~" + l] || [], k;
      for (k = 0; k < r.length; k += 4) p.rect(r[k], r[k + 1], r[k + 2] - r[k], r[k + 3] - r[k + 1]);
      q.forEach(function (pts) { p.moveTo(pts[0], pts[1]); for (var j = 2; j < pts.length; j += 2) p.lineTo(pts[j], pts[j + 1]); p.closePath(); });
      if (!r.length && !q.length) return;
      var col = /con$|^via/.test(l) ? "cut" : l;
      G[part + "." + l] = { path: p, col: col, a: 0, to: 0, from: 0 }; ORDER.push(part + "." + l);
    });
  }
  var CLS = ["fill", "tap", "logic", "buf", "ff", "diode", "tie"];
  CLS.forEach(function (c) {
    var p = new Path2D(), any = false;
    D.cells.forEach(function (q) { if (D.mcls[q[4]] === c) { p.rect(q[0], q[1], q[2], q[3]); any = true; } });
    if (any) { G["cells." + c] = { path: p, col: c, a: 0, to: 0, from: 0, edge: true }; ORDER.push("cells." + c); }
  });
  addShapes("corew", D.corew, ["met1", "met2", "met3", "met4"]);
  addShapes("mac", D.mac, ["nwell", "diff", "poly", "licon", "li1", "mcon", "met1", "via1", "met2"]);
  addShapes("wrap", D.wrap, ["li1", "mcon", "met1", "via1", "met2", "via2", "met3", "via3", "met4"]);
  addShapes("top", D.top, ["met3", "via3", "met4"]);
  var NCLS = {};
  D.cells.forEach(function (q) { var c = D.mcls[q[4]]; NCLS[c] = (NCLS[c] || 0) + 1; });
  var CELL = {};
  D.cells.forEach(function (q) { CELL[q[5]] = q; });
  D.pins = D.pins.filter(function (q) { return !/^V(PWR|GND|DD|SS)/.test(q[0]); });
  var NODE = {}; D.nodes.forEach(function (q) { NODE[q[0]] = q; });

  var DIE = D.die, CORE = D.core, MAC = D.macro;
  function box(b, pad) { pad = pad === undefined ? 0.06 : pad; var w = b[2] - b[0], h = b[3] - b[1], m = Math.max(w, h) * pad; return [b[0] - m, b[1] - m, b[2] + m, b[3] + m]; }
  function around(x, y, half) { return [x - half, y - half, x + half, y + half]; }
  function bboxOf(list) {
    var b = [1e12, 1e12, -1e12, -1e12];
    list.forEach(function (q) { b[0] = Math.min(b[0], q[1]); b[1] = Math.min(b[1], q[2]); b[2] = Math.max(b[2], q[3]); b[3] = Math.max(b[3], q[4]); });
    return b;
  }

  // ---- the sabotage campaign, from the data -----------------------------------------------------
  var SAB = ["S1", "S2", "S3", "S4", "S5", "S6", "S7", "S8", "S9", "S10"];
  var SABTXT = {
    S1: ["connectivity", "The macro's VDD strap is left unjoined from the tile's VPWR."],
    S2: ["connectivity", "The macro's GND strap is left unjoined from the tile's VGND."],
    S3: ["connectivity", "The riser of one decoder line (SA1B) is missing."],
    S4: ["connectivity", "The risers of XA_OUT and XB_OUT are crossed."],
    S5: ["connectivity", "XA is shorted to GND by a small stack of metal 1, via and metal 2."],
    S6: ["symmetry", "The macro is mirrored in x. As built, its pins no longer land under the core, so this is a connectivity fault and not the pure symmetry fault it was meant to be."],
    S7: ["coupling", "The witness: a floating metal 3 strip over XA's line and not over XB's, driven as a 50 MHz clock in SPICE through its extracted coupling."],
    S8: ["coupling", "A floating metal 3 plate over XA only: a passive, asymmetric capacitance."],
    S9: ["logic", "The decoder is mutated in RTL (SA2B uses s0 instead of its complement) and the core is hardened again. The layout outside the core is unchanged."],
    S10: ["timing", "The core is mutated so that the source select toggles during the measurement window, and hardened again. The layout outside the core is unchanged."]
  };
  function sabVerdict(s) {
    var st = D.std[s], out = { std: st && (st.drc > 0 || st.lvs !== "match" || st.precheck !== "pasa"), e3: D.e3[s] === "MISMATCH", e3run: s in D.e3 };
    out.stdTxt = st ? "DRC " + st.drc + " · LVS " + (st.lvs === "match" ? "match" : "mismatch") + " · precheck " + (st.precheck === "pasa" ? "pass" : "fail") : "not run";
    if (s === "S7" || s === "S8") { out.meas = D.i4wit[s][1] >= 1; out.measTxt = "I4: " + fmt(D.i4wit[s][0], 3) + " %, " + fmt(D.i4wit[s][1], 1) + "× the threshold"; }
    else if (s === "S9") { out.meas = D.meas.S9_i2 > 0; out.measTxt = "I2: " + D.meas.S9_i2 + " discrepancies against the decoder's table (healthy: " + D.meas.ok_i2 + ")"; }
    else if (s === "S10") { out.meas = D.meas.S10_i3 > 0; out.measTxt = "I3: " + n(D.meas.S10_i3) + " toggles on the decoder's lines during the windows (healthy: " + D.meas.ok_i3 + ")"; }
    else { out.meas = null; out.measTxt = "no measurement check runs on it"; }
    return out;
  }
  var CAMP = (function () {
    var c = { conn: 5, std: 0, mstd: 0, meas: 0, missed: [] };
    ["S1", "S2", "S3", "S4", "S5"].forEach(function (s) { if (sabVerdict(s).std) c.std++; else c.missed.push(s); });
    ["S7", "S8", "S9", "S10"].forEach(function (s) { var q = sabVerdict(s); if (q.std) c.mstd++; if (q.meas) c.meas++; });
    return c;
  })();
  var sabSel = "S7", SABPATH = {};
  SAB.forEach(function (s) {
    var v = D.sab[s]; if (!v) return;
    var mk = function (list) { var p = new Path2D(); list.forEach(function (q) { p.rect(q[1], q[2], q[3] - q[1], q[4] - q[2]); }); return p; };
    var big = v.add.length > 200;             // S6: the whole macro moves; drawn as an outline, not shape by shape
    SABPATH[s] = { add: big ? null : mk(v.add), del: big ? null : mk(v.del), big: big,
                   box: big ? box(MAC, 0.25) : v.add.length + v.del.length ? box(bboxOf(v.add.concat(v.del)), 0.9) : box(CORE, 0.05) };
  });

  // ---- E2: the phase sweep ------------------------------------------------------------------------
  var E2 = (function () {
    var S = [["l216", "21.6"], ["l80", "8.0"], ["l40", "4.0"]], thr = D.i4["tt 27"].thr, out = { thr: thr, series: [] };
    S.forEach(function (s) {
      var pts = [], want = s[0] === "l216" ? 20 : 10;
      for (var k = 0; k < 20; k++) { var v = D.e2.d[s[0] + "f" + k]; if (v) pts.push([k, v[v.length - 1][1]]); }
      var mx = pts.reduce(function (a, p) { return Math.max(a, Math.abs(p[1])); }, 0);
      out.series.push({ key: s[0], len: s[1], cap: D.e2.caps_aF[s[1]], pts: pts, want: want, max: mx });
    });
    return out;
  })();

  // ---- the steps --------------------------------------------------------------------------------
  // show: which drawables are the step's subject (1), which stay as context (a fraction), the rest hidden
  var CTX = 0.16;
  function show(focus, context) { var m = {}; (context || []).forEach(function (k) { m[k] = CTX; }); focus.forEach(function (k) { m[k] = 1; }); return m; }
  var ALLCELLS = ["cells.fill", "cells.tap", "cells.logic", "cells.buf", "cells.ff", "cells.diode", "cells.tie"];
  var COREW = ["corew.met1", "corew.met2", "corew.met3", "corew.met4"];
  var MACL = ["mac.nwell", "mac.diff", "mac.poly", "mac.licon", "mac.li1", "mac.mcon", "mac.met1", "mac.via1", "mac.met2"];
  var WRAPL = ["wrap.li1", "wrap.mcon", "wrap.met1", "wrap.via1", "wrap.met2", "wrap.via2", "wrap.met3", "wrap.via3", "wrap.met4"];
  var TOPL = ["top.met3", "top.via3", "top.met4"];
  var tt = D.corners[0], I4 = D.i4["tt 27"];
  var free = um(DIE[2]) * um(DIE[3]) - um(CORE[2] - CORE[0]) * um(CORE[3] - CORE[1]) - um(MAC[2] - MAC[0]) * um(MAC[3] - MAC[1]);
  var MODEL = '<p class="model">Everything on this page is model: SPICE, extraction, DRC, LVS, gate-level simulation. None of it is silicon.</p>';
  function srcs() { return '<p class="src">' + Array.prototype.map.call(arguments, function (s) { return "<code>" + s + "</code>"; }).join(" · ") + "</p>"; }

  var STEPS = [
    { id: "tile", short: "Tile", title: "A 1×2 Tiny Tapeout tile",
      view: function () { return box(DIE); }, show: show([], ALLCELLS.concat(["mac.li1", "mac.met1", "mac.poly", "top.met4", "corew.met4"])), labels: ["pins"],
      lede: "The empty rectangle the design must fit in, with its pins along the top edge.",
      body: function () {
        return MODEL + "<p><b>Galois</b> is the working name of the chip Exotic Cells will send to Tiny Tapeout on SkyWater 130 nm. Its job is to time the discharge of a small node so finely that <b>one electron trapped in a transistor's oxide</b> shows up as a change in a count.</p>" +

          "<p>The tile is " + fmt(um(DIE[2])) + " × " + fmt(um(DIE[3])) + " µm, two Tiny Tapeout tiles stacked. It has " + D.pins.length + " signal pins on metal 4 at the top edge. Only digital pins are used.</p>" +

    { id: "core", short: "Core", title: "The digital core",

          "<p>It holds a counter clocked at 50 MHz, an 8-bit protocol over the tile's pins, and the decoder that drives the slot's control lines. A slot that is disabled or not selected cannot reach the counter.</p>" +

    { id: "slot", short: "Slot", title: "The XC-19 slot, drawn by hand",

          "<p>In each half a node <b>X</b> is precharged to 1.8 V and then discharged by one transistor in weak inversion, the <b>DUT</b>. When X crosses the threshold of an inverter, the core stops counting. A trap in the DUT of A that holds one electron shifts its threshold and makes A cross a little earlier or later than B.</p>" +
          "<p>The signal is the <b>ratio</b> of the two times, tA / tB. Whatever moves both halves alike, such as supply or temperature, cancels in it; whatever touches only one of them does not. Most of the checks on this page ask how well that holds once the macro sits in a real tile.</p>" +

    { id: "nodes", short: "Nodes", title: "The measured nodes",

      lede: "XA and XB, with their precharge and DUT lines.",
      body: function () {

          "<p>At the typical corner (tt, 27 °C) the discharge takes " + fmt(tt.tA_us, 3) + " µs, which the 50 MHz counter reads as " + fmt(tt.counts, 1) + " counts. One trapped electron changes the time by " + fmt(tt.sc, 4) + " % in the extracted macro.</p>" +

    { id: "supply", short: "Supply", title: "Supply, and a rule that got in the way",

          "<p>The other straps stop just above the macro. A strap continuing down would pass over XA's line and not over XB's, or the other way round, and add capacitance to one side only.</p>" +

    { id: "measure", short: "Measure", title: "One measurement",

          "<p><b>Per electron</b> is the change of tA when one electron is trapped in the DUT. The <b>threshold</b> used from here on is a tenth of that: anything in the tile that moves tA / tB by more would be mistaken for a tenth of an electron.</p>" +
          "<p>At ff 85 °C the discharge is over in " + fmt(D.corners[3].counts, 1) + " counts, so one electron is worth " + fmt(D.corners[3].counts * D.corners[3].sc / 100, 2) + " of a count, against " + fmt(tt.counts * tt.sc / 100, 2) + " counts at tt. At that corner the instrument cannot see a single charge in one shot.</p>" +

    { id: "aggressors", short: "Aggressors", title: "Real aggressors",

      show: show(["wrap.met2", "wrap.met3", "corew.met1", "corew.met2", "corew.met3"], ALLCELLS.concat(MACL)), labels: ["agr", "stubs"], legend: ["met1", "met2", "met3"],

        return "<p>Check <b>I4</b> asks whether the core, while it is running a measurement, disturbs the measurement. The tile is extracted flat; every net that couples to XA, XB or their outputs and toggles during the window is replayed in SPICE with its real timing, against the same tile with those nets held still.</p>" +

          "<table><tr><th>Corner</th><th class=num>Max change of tA / tB</th><th class=num>Threshold</th><th></th></tr>" +
          Object.keys(D.i4).map(function (k) { var r = D.i4[k]; return "<tr><td>" + k + " °C</td><td class=num>" + fmt(r.max, 5) + " %</td><td class=num>" + fmt(r.thr, 4) + " %</td><td>" + grade(r.max < r.thr ? "ok" : "bad", r.max < r.thr ? "below" : "above") + "</td></tr>"; }).join("") + "</table>" +
          "<p>The healthy tile stays below the threshold at all four corners, by a factor of " + fmt(I4.thr / I4.max, 1) + " at tt. One net does all of it: with one aggressor at a time, <code>input3.X</code> gives " + fmt(D.abl.agin3, 5) + " % and the other two give " + fmt(D.abl.ag685, 5) + " %. It is the buffer of XB's output, sitting next to XA_OUT: B crosses first, and B's own edge kicks A.</p>" +
          "<p>That number assumed an ideal step. With the real buffer cell in the deck the effect is " + fmt(D.e1[0][2], 5) + " % at every corner, because the buffer switches before the crossing that is timed. With a mismatch between A and B the ideal step is the realistic worst case, so that is the figure kept.</p>" +

        return "<p>A check that passes proves little until it has been seen to fail. Each sabotage is generated by the same script that assembles the healthy tile, with one thing changed, and then run through the same checks.</p>" +

    { id: "sensitivity", short: "Sensitivity", title: "How small a coupling can I4 see?",
      view: function () { return SABPATH.S7.box; }, show: show(["wrap.met3", "top.met3"], ALLCELLS.concat(MACL)), card: cardE2,
      lede: "The witness strip at three lengths, its clock swept in phase.",
      body: function () {
        var s = E2.series, got = s.reduce(function (a, q) { return a + q.pts.length; }, 0), want = s.reduce(function (a, q) { return a + q.want; }, 0);
        var done = got === want;
        return "<p>The witness S7 was required to give more than 10× the threshold, to show I4 is not blind. It gave " + fmt(D.i4wit.S7[1], 1) + "×, so by its own rule the benchmark is <b>invalid</b>: I4 sees a clock coupled through " + fmt(E2.series[0].cap, 1) + " aF, and nothing was shown about a weaker one.</p>" +
          "<p>Amendment 3 (E2) measures the sensitivity directly: the same strip at three lengths, extracted each time, with the clock's phase swept over its 20 ns period.</p>" +
          "<table><tr><th>Strip</th><th class=num>Coupling to XA</th><th class=num>Phases</th><th class=num>Max |change|</th><th class=num>× threshold</th></tr>" +
          s.map(function (q) { return "<tr><td>" + q.len + " µm</td><td class=num>" + fmt(q.cap, 2) + " aF</td><td class=num>" + q.pts.length + " of " + q.want + "</td><td class=num>" + fmt(q.max, 5) + " %</td><td class=num>" + fmt(q.max / E2.thr, 2) + "</td></tr>"; }).join("") + "</table>" +
          (function () {
            var L = s[0], rows = "", hit = 0, nd = { ok: 0, aborted: 0, control: 0 };
            D.e2.decks.forEach(function (d) { nd[d[1]]++; });
            s.slice(1).forEach(function (q) {
              var dev = (q.max / L.max) / (q.cap / L.cap) - 1, x = q.max / E2.thr, in13 = x >= 1 && x <= 3; if (in13) hit++;
              rows += "<tr><td>E2a, " + q.len + " µm</td><td>Maximum scales with the coupling within ±30 %: " + (dev > 0 ? "+" : "") + fmt(dev * 100, 1) + " %</td><td>" + grade(Math.abs(dev) <= 0.3 ? "ok" : "bad", Math.abs(dev) <= 0.3 ? "met" : "false") + "</td></tr>";
            });
            rows += "<tr><td>E2b</td><td>At least one short strip lands between 1× and 3× the threshold: " + hit + " of 2</td><td>" + grade(hit ? "ok" : "bad", hit ? "met" : "false, benchmark invalid") + "</td></tr>";
            var num = 0, den = 0; s.forEach(function (q) { num += q.max * q.cap; den += q.cap * q.cap; });
            return "<table><tr><th></th><th>Prediction</th><th></th></tr>" + rows + "</table>" +
              "<p>Fitted through the origin, I4 responds with " + fmt(num / den * 1000, 3) + " thousandths of a percent per aF of clock on XA. The smallest coupling it can tell from nothing is then the threshold over that slope, " + fmt(E2.thr / (num / den), 0) + " aF.</p>" +
              (done ? "" : "<p>" + grade("unk", "provisional: " + got + " of " + want + " phases") + " The verdicts above are over the phases measured so far. A missing phase can only raise the longest strip's maximum.</p>") +
              "<p><b>What the sweep cost.</b> Of " + D.e2.decks.length + " SPICE decks, " + nd.ok + " count, " + nd.aborted + " aborted in the simulator and " + nd.control + " finished but are left out because their control phase did not repeat the earlier run within 0.001 points. Most of those ran with a 2 ns maximum time step, which turned out not to be converged for decks with few clocks in them; rerun at 0.5 ns, all but one repeat it.</p>";
          })() +

          srcs("experiments/misfit04/i4/corridas/p5*/", "experiments/misfit04/e2/caps_e2.json", "cells/preregistros/MISFIT-04_2026-11-24_tile_integrado_enmienda3.md");

  var r0 = view.getBoundingClientRect(); W = r0.width; H = r0.height;
  var first = 0; STEPS.forEach(function (s, i) { if ("#" + s.id === location.hash) first = i; });
  go(first, true); resize();
  window.galoisProbe = { steps: STEPS.map(function (s) { return s.id; }), go: go, state: function () { return { cur: cur, cam: cam, W: W, H: H }; } };
}
